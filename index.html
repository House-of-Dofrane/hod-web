<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House of Dofrane</title>
<meta name="description" content="House of Dofrane — real estate creative solutions. Marketing & video, placemaking, research, capital.">
<link rel="canonical" href="https://houseofdofrane.com/">
<meta property="og:title" content="House of Dofrane">
<meta property="og:description" content="Real estate creative solutions.">
<meta property="og:url" content="https://houseofdofrane.com/">
<meta name="robots" content="index,follow">
<style>
  :root{--oxblood:#6E1E2A;--ink:#141214;--champagne:#E8D9B8;--ivory:#F6F1E7;--silver:#B9B6AE}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--ivory);font-family:Georgia,"Times New Roman",serif;display:grid;place-items:center;padding:2rem}
  main{max-width:34rem;text-align:center}
  .mark{width:64px;height:64px;margin:0 auto 2rem;border:1px solid var(--champagne);display:grid;place-items:center;color:var(--champagne);font-size:1.4rem;letter-spacing:.2em}
  h1{font-weight:400;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:.06em;text-transform:uppercase;color:var(--ivory)}
  .rule{width:48px;height:1px;background:var(--oxblood);margin:1.5rem auto}
  p{color:var(--silver);font-size:1.05rem;line-height:1.7}
  .pillars{margin-top:2.5rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem 1.4rem;font-family:system-ui,-apple-system,sans-serif;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--champagne)}
  a{color:var(--champagne);text-decoration:none;border-bottom:1px solid var(--oxblood)}
  footer{margin-top:3.5rem;font-family:system-ui,-apple-system,sans-serif;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--silver)}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">HD</div>
  <h1>House of Dofrane</h1>
  <div class="rule"></div>
  <p>Real estate creative solutions. A new site is in the works.</p>
  <div class="pillars">
    <span>Marketing &amp; Video</span><span>Placemaking</span><span>Research</span><span>Capital</span>
  </div>
  <footer>Washington, DC · <a href="mailto:hello@houseofdofrane.com">hello@houseofdofrane.com</a></footer>
</main>
</body>
</html>
